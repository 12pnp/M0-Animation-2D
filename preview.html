<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spine Preview</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #333; }
      #err {
        position: absolute; inset: 0; padding: 10px 12px; display: none;
        font: 11px/1.5 "SF Mono", Menlo, monospace; color: #ff8a80;
        background: #2b2b2b; white-space: pre-wrap; overflow: auto;
      }
      #warn {
        position: absolute; left: 6px; right: 6px; bottom: 6px; padding: 3px 7px;
        font: 11px/1.4 system-ui, sans-serif; color: #f6c86b;
        background: rgba(40, 32, 16, 0.85); border: 1px solid rgba(246, 200, 107, 0.35);
        border-radius: 4px; pointer-events: none;
      }
      #warn[hidden] { display: none; }
    </style>
    <!-- A classic script: the global PIXI. The oracle runtime (spine-pixi-v8,
         `npm run dev:oracle` only) maps require("pixi.js") to it. -->
    <script src="/vendor/pixi.js"></script>
  </head>
  <body>
    <div id="err"></div>
    <div id="warn" hidden></div>
    <script type="module" src="/src/preview/previewClient.ts"></script>
  </body>
</html>
